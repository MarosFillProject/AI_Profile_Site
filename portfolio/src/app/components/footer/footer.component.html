<footer id="contact" class="footer">
  <div class="container">
    <div class="footer__cta" appReveal>
      <h2 class="footer__title">Let's build something exceptional.</h2>
      <p class="footer__subtitle">
        Open to senior engineering roles, AI web development, consulting, and meaningful collaborations.
      </p>

      <div class="footer__actions">
        <a [href]="'mailto:' + profile.email" class="footer__btn footer__btn--primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="2" y="4" width="20" height="16" rx="2"/>
            <path d="M22 7l-10 7L2 7"/>
          </svg>
          {{ profile.email }}
        </a>
        <a
          [href]="profile.linkedin"
          target="_blank"
          rel="noopener noreferrer"
          class="footer__btn footer__btn--ghost"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 114.127 0 2.062 2.062 0 01-2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
          </svg>
          Connect on LinkedIn
        </a>
      </div>
    </div>

    <div class="footer__bottom" appReveal>
      <div class="footer__brand">
        <span class="footer__mark">MF</span>
        <span>{{ profile.name }}</span>
      </div>
      <p class="footer__copy">&copy; {{ year }} — Crafted with Angular</p>
      <p class="footer__location">{{ profile.location }}</p>
    </div>
  </div>
</footer>
